---
- name: Configure MQTT Broker
  hosts: broker
  become: true
  gather_facts: true

  vars:
    mqtt_user: "opsagent"
    mqtt_password: "{{ lookup('env', 'MQTT_PASSWORD') }}"
    mosquitto_config_dir: /opt/mosquitto/config
    mosquitto_data_dir: /opt/mosquitto/data
    mosquitto_log_dir: /opt/mosquitto/log

  tasks:
    - name: Wait for SSH to be ready
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      retries: 5
      delay: 10
      register: apt_update
      until: apt_update is succeeded

    - name: Install Docker dependencies
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
        state: present

    - name: Add Docker GPG key
      ansible.builtin.shell:
        cmd: |
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
        creates: /etc/apt/keyrings/docker.asc

    - name: Add Docker apt repository
      ansible.builtin.shell:
        cmd: |
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] \
          https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
          > /etc/apt/sources.list.d/docker.list
        creates: /etc/apt/sources.list.d/docker.list

    - name: Install Docker Engine
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
        update_cache: true
        state: present
      retries: 3
      delay: 10
      register: docker_install
      until: docker_install is succeeded

    - name: Ensure Docker service is started and enabled
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Create Mosquitto directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0777"
      loop:
        - "{{ mosquitto_config_dir }}"
        - "{{ mosquitto_data_dir }}"
        - "{{ mosquitto_log_dir }}"

    - name: Deploy Mosquitto config
      ansible.builtin.template:
        src: mosquitto.conf.j2
        dest: "{{ mosquitto_config_dir }}/mosquitto.conf"
        mode: "0644"

    - name: Create empty passwd file
      ansible.builtin.file:
        path: "{{ mosquitto_config_dir }}/passwd"
        state: touch
        mode: "0666"
      changed_when: false

    - name: Generate Mosquitto passwd file using container (correct PBKDF2 format)
      ansible.builtin.shell:
        cmd: >
          docker run --rm
          --entrypoint mosquitto_passwd
          -v {{ mosquitto_config_dir }}:/mosquitto/config
          eclipse-mosquitto:2
          -b /mosquitto/config/passwd {{ mqtt_user }} {{ mqtt_password }}
      no_log: true
      changed_when: true

    - name: Set password file permissions
      ansible.builtin.file:
        path: "{{ mosquitto_config_dir }}/passwd"
        mode: "0600"

    - name: Stop and remove existing Mosquitto container (if any)
      ansible.builtin.shell:
        cmd: docker rm -f mosquitto 2>/dev/null || true
      changed_when: false

    - name: Run Mosquitto broker container
      ansible.builtin.shell:
        cmd: |
          docker run -d \
            --name mosquitto \
            --restart always \
            -p 1883:1883 \
            -p 8883:8883 \
            -p 8080:8080 \
            -v {{ mosquitto_config_dir }}:/mosquitto/config \
            -v {{ mosquitto_data_dir }}:/mosquitto/data \
            -v {{ mosquitto_log_dir }}:/mosquitto/log \
            eclipse-mosquitto:2
      register: container_start
      changed_when: container_start.rc == 0

    - name: Wait 5 seconds for container to initialize
      ansible.builtin.pause:
        seconds: 5

    - name: Show container logs (for diagnostics)
      ansible.builtin.shell:
        cmd: docker logs mosquitto 2>&1
      register: container_logs
      changed_when: false
      failed_when: false

    - name: Print container logs
      ansible.builtin.debug:
        msg: "{{ container_logs.stdout_lines }}"

    - name: Wait for MQTT port to be available
      ansible.builtin.wait_for:
        port: 1883
        host: "127.0.0.1"
        delay: 5
        timeout: 90
